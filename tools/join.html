<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>端末を接続 | AR作業支援</title>
<p>端末を接続しています。</p>
<noscript>参加するにはブラウザのJavaScriptを有効にし、QRをもう一度読み取ってください。</noscript>
<form method="post"><input type="hidden" name="invite"></form>
<script nonce="NONCE">
  const invitation = location.hash.slice(1);
  history.replaceState(null, "", location.pathname);
  if (/^[A-Za-z0-9_-]{43}$/.test(invitation)) {
    document.forms[0].elements.invite.value = invitation;
    document.forms[0].submit();
  } else {
    location.replace("/");
  }
</script></html>
