<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ユーザー選択 | AR作業支援</title>
  <link rel="stylesheet" href="/library.css">
</head>
<body>
  <main class="entry">
    <h1>ユーザー選択</h1>
    <form action="/enter" method="get">
      <label for="user">ユーザーID</label>
      <input type="text" id="user" name="id" placeholder="P1" required maxlength="32"
             autocomplete="off" autocapitalize="characters" spellcheck="false">
      <p id="invalid" role="alert" hidden>このIDは使えません。P1のように半角英数字で始め、英数字・ハイフン・下線で入力してください。</p>
      <button class="btn primary" type="submit">機器一覧を開く</button>
    </form>
  </main>
  <script>
    document.querySelector("#invalid").hidden = !new URLSearchParams(location.search).has("invalid");
  </script>
</body>
</html>
