<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>作業支援</title>
  <link rel="stylesheet" href="/library.css">
  <link rel="stylesheet" href="/support.css">
  <script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
  <script type="module" src="/support.js"></script>
</head>
<body>
  <main>
    <nav class="links"><a id="back" href="/">機器一覧</a><a id="pdf" target="_blank" rel="noopener">元PDFを開く</a></nav>
    <h1 id="name">作業支援</h1>
    <p id="status" role="status"></p>
    <form id="choose" hidden>
      <label>どの型番ですか？ <select id="models"></select><input id="custom" maxlength="160" aria-label="型番を入力"></label>
      <button class="btn primary">この型番で作成</button>
    </form>
    <button id="action" class="btn" hidden></button>
    <section id="guide" hidden aria-label="手順とモデル">
      <div class="selectors"><label>作業 <select id="tasks"></select></label><label>手順 <select id="steps"></select></label></div>
      <div class="workspace">
        <div>
          <div id="viewport">
            <svg id="leader" aria-hidden="true" hidden><line/><circle r="4"/></svg>
            <div id="panel" hidden></div>
          </div>
          <p id="model-status" role="status"></p>
          <button id="play" class="btn" hidden>動きを再生</button>
        </div>
        <section class="instruction">
          <h2>手順</h2><p id="instruction"></p><p id="pages"></p>
          <figure id="illustration" hidden>
            <div id="image-wrap"><img id="image" alt="説明書の図"><span id="pin" hidden></span></div>
            <figcaption><button id="prev" aria-label="前の図">‹</button><span id="fig-count"></span><button id="next" aria-label="次の図">›</button></figcaption>
          </figure>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
