<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-ui>作業支援</title>
  <link rel="stylesheet" href="/support.css?quest-panel">
  <script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
  <script type="module" src="/support.js?language"></script>
</head>
<body>
  <header class="toolbar">
    <a id="back" href="/" data-ui>‹ 機器一覧</a>
    <div class="device"><h1 id="name" data-ui>作業支援</h1><span id="model"></span></div>
    <a id="pdf" target="_blank" rel="noopener" data-ui>元PDFを開く ↗</a>
    <select id="locale" aria-label="表示言語"><option value="ja" lang="ja">日本語</option><option value="en" lang="en">English</option></select>
  </header>
  <main>
    <div class="workflow">
      <p id="status" role="status"></p>
      <form id="choose" hidden>
        <label><span data-ui>型番</span> <select id="models"></select><input id="custom" maxlength="160" aria-label="型番を入力"></label>
        <button data-ui>この型番で作成</button>
      </form>
      <button id="action" hidden></button>
      <button id="enter-assist" hidden>位置合わせ・AR支援</button>
      <span id="assist-status" role="status"></span>
      <details id="alignment-record" hidden><summary>直近の位置合わせ記録</summary><p></p><ul></ul></details>
      <div id="capture-tools" hidden>
        <label id="capture-voice-option" hidden><input type="checkbox" id="capture-live" checked> Gemini音声を使う（案内文のみGoogleに送信）</label>
        <button id="enter-mr" hidden data-ui>MR撮影を開く</button>
        <details id="captures"><summary data-ui>実機の撮影記録</summary><ul></ul></details>
      </div>
      <p id="mr-feedback" role="status"></p>
      <button id="retry-capture" hidden data-ui>撮影記録を再送する</button>
    </div>
    <section id="guide" hidden aria-label="手順とモデル">
      <div id="viewport" aria-label="機器の3Dモデル"></div>
      <p id="model-status" role="status"></p>
      <svg id="leader" aria-hidden="true" hidden><line/><circle r="4"/></svg>
      <section class="quest" aria-labelledby="task-title">
        <header class="quest-heading">
          <h2 id="task-title"></h2>
          <img class="lock" src="/quest-lock.png" alt="パネル位置固定" width="38" height="38">
        </header>
        <details id="precautions" hidden>
          <summary data-ui>作業前の注意</summary><ul id="precaution-list"></ul>
        </details>
        <div class="step-meta">
          <span id="counter" aria-label="手順の進捗"></span>
          <div class="source"><span id="pages"></span><span id="language"></span></div>
        </div>
        <figure id="illustration" hidden>
          <div class="figure-stage"><div id="image-wrap"><img id="image" alt="説明書の図"><span id="pin" hidden></span></div></div>
          <figcaption><button id="prev" aria-label="前の図">‹</button><span id="fig-count"></span><button id="next" aria-label="次の図">›</button></figcaption>
        </figure>
        <div class="step-body">
          <span id="panel" hidden></span>
          <p id="instruction"></p>
        </div>
        <nav class="controls" aria-label="手順の操作">
          <button id="step-back" title="前の手順" aria-label="前の手順"><svg width="44" height="33" aria-hidden="true"><use href="/quest-controls.svg#previous"/></svg></button>
          <button id="play" title="動きを再生" aria-label="動きを再生" disabled><svg width="44" height="33" aria-hidden="true"><use href="/quest-controls.svg#play"/></svg></button>
          <button id="step-next" title="次の手順" aria-label="次の手順"><svg width="44" height="33" aria-hidden="true"><use href="/quest-controls.svg#next"/></svg></button>
          <button id="index" title="手順一覧" aria-label="手順一覧"><svg width="44" height="33" aria-hidden="true"><use href="/quest-controls.svg#settings"/></svg></button>
          <button id="exit" title="終了して機器一覧に戻る" aria-label="終了して機器一覧に戻る"><svg width="44" height="33" aria-hidden="true"><use href="/quest-controls.svg#close"/></svg></button>
        </nav>
        <span class="move-bar" aria-hidden="true"></span>
      </section>
    </section>
    <dialog id="contents" aria-labelledby="contents-title">
      <form method="dialog"><h2 id="contents-title" data-ui>手順一覧</h2>
        <label><span data-ui>作業</span> <select id="tasks"></select></label>
        <label><span data-ui>手順</span> <select id="steps"></select></label>
        <button autofocus data-ui>手順に戻る</button>
      </form>
    </dialog>
  </main>
</body>
</html>
